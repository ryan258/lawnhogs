<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Params.brandName }} — Premium Lugged Outdoors™{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta name="theme-color" content="#1E3D2F">
<link rel="canonical" href="{{ .Permalink }}">

<!-- Open Graph / Facebook -->
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Params.brandName }}{{ end }}">
<meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta property="og:image" content="{{ with .Params.image }}{{ . | absURL }}{{ else }}{{ "images/hero-mower.webp" | absURL }}{{ end }}">
<meta property="og:site_name" content="Lawn Hogs">

<!-- Twitter Cards -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Params.brandName }}{{ end }}">
<meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta name="twitter:image" content="{{ with .Params.image }}{{ . | absURL }}{{ else }}{{ "images/hero-mower.webp" | absURL }}{{ end }}">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Bebas+Neue&family=Permanent+Marker&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,700&family=Roboto+Slab:wght@700;900&display=swap" rel="stylesheet">

<!-- CSS (Compiled from Modular BEM Sass) -->
{{ $style := resources.Get "scss/main.scss" | toCSS (dict "targetPath" "css/main.css" "outputStyle" "compressed") | minify | fingerprint }}
<link rel="stylesheet" href="{{ $style.RelPermalink }}" integrity="{{ $style.Data.Integrity }}">

<!-- Structured Data (JSON-LD) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "HomeAndConstructionBusiness",
  "name": "Lawn Hogs — Premium Lugged Outdoors™",
  "image": "{{ "images/hero-mower.webp" | absURL }}",
  "@id": "{{ .Site.BaseURL }}",
  "url": "{{ .Site.BaseURL }}",
  "telephone": "+1-800-669-4647",
  "priceRange": "$$$$",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "400 Hog Dominance Way",
    "addressLocality": "Suburban Estate Ridge",
    "addressRegion": "IL",
    "postalCode": "60010",
    "addressCountry": "US"
  },
  "geo": {
    "@type": "GeoCoordinates",
    "latitude": 42.15,
    "longitude": -88.13
  },
  "openingHoursSpecification": {
    "@type": "OpeningHoursSpecification",
    "dayOfWeek": [
      "Monday",
      "Tuesday",
      "Wednesday",
      "Thursday",
      "Friday",
      "Saturday"
    ],
    "opens": "06:30",
    "closes": "20:00"
  },
  "sameAs": [
    "https://instagram.com/lawnhogs",
    "https://youtube.com/@lawnhogs"
  ],
  "aggregateRating": {
    "@type": "AggregateRating",
    "ratingValue": "4.99",
    "reviewCount": "1842"
  },
  "slogan": "WE CUT GRASS. YOU TOUCH GRASS."
}
</script>
